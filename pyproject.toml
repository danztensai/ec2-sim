[project]
name = "ec2-sim"
version = "0.1.0"
description = "Local EC2 simulator: instances are Docker containers, AMIs are Docker images"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "cryptography>=50.0.2",
    "docker>=7.2.0",
    "boto3>=1.40",
    "moto[ec2,server]>=5.2.5",
    "pyyaml>=6.0",
]

[project.scripts]
ec2-sim = "ec2sim.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ec2sim"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.sdist]
# The desktop app (ui/, with node_modules and Rust build output) isn't part of the Python package.
include = ["ec2sim", "tests", "examples", "README.md", "LICENSE", "NOTICE"]
