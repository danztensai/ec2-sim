[project]
name = "ec2-sim"
version = "0.1.0"
description = "Local EC2 simulator: instances are Docker containers, AMIs are Docker images"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "cryptography>=50.0.2",
    "docker>=7.2.0",
    "moto[ec2,server]>=5.2.5",
]

[project.scripts]
ec2-sim = "ec2sim.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ec2sim"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
